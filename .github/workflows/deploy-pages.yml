# Costruisce il sito a ogni push su `main`, e lo pubblica.
#
# I due verbi restano due job separati, perché restano due responsabilità
# diverse — ma non sono più due decisioni: dal momento in cui il sito è online,
# `main` **è** il sito, e un push su `main` è già la decisione di pubblicare.
#
#   costruisci  gira a ogni push su `main` e a ogni lancio manuale: dati, test,
#               ricalcolo delle cifre citate, sito, artefatto. Non tocca Pages.
#               Se uno qualunque dei suoi passi è rosso, `pubblica` non parte:
#               è il cancello che è rimasto, e adesso è l'unico.
#   pubblica    gira dopo `costruisci`, su ogni push a `main`. A mano ci si
#               arriva solo scrivendo `pubblica` nella casella di conferma,
#               così «Run workflow» resta anche un modo di costruire e basta,
#               per provare il sito da un ramo senza mandarlo online.
#
# 🙋 Come si pubblica: si fa merge su `main`. Non c'è altro da fare.
#
# 🙋 Come si costruisce **senza** pubblicare, da un ramo qualsiasi:
#    Actions → «Pubblica il sito» → Run workflow → lascia conferma = `no` →
#    Run. Il sito esce come artefatto scaricabile dalla pagina dell'esecuzione.
#
# 🙋 Da fare una volta sola, e lo può fare solo il proprietario del repository:
#    Settings → Pages → Source = «GitHub Actions».
#    Senza, il primo deploy fallisce. E non basta che Pages sia acceso: ad
#    agosto 2026 lo è, ma con la sorgente su un ramo, e con quella impostazione
#    GitHub passa il repository per Jekyll e pubblica il README invece del sito.
#    `configure-pages` con `enablement: true` accende Pages quando è spento, non
#    cambia la sorgente di un Pages già acceso.

name: Pubblica il sito

on:
  workflow_dispatch:
    inputs:
      conferma:
        description: 'Scrivi «pubblica» per mandare online anche questo lancio a mano. Qualunque altra cosa costruisce e basta.'
        required: true
        default: 'no'
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Un gruppo solo, e `cancel-in-progress: false`.
#
# Finché pubblicava solo il lancio a mano, le build si potevano annullare fra
# loro senza danno e i due generi stavano in gruppi separati. Adesso **ogni**
# esecuzione su `main` può arrivare al deploy, quindi annullarne una a metà
# lascerebbe il sito monco: non si annulla più niente che sia già partito.
#
# I push che arrivano mentre una pubblicazione è in corso si mettono in coda;
# fra due in attesa GitHub tiene la più recente, che è quella che si vuole
# online.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  costruisci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Serve la storia: la data dei dati viene dall'ultimo commit che ha
          # toccato dati/processed/, e con un checkout superficiale non c'è.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installa la pipeline
        run: pip install -e ./pipeline

      # I JSON per il sito si ricavano dalle tabelle versionate in
      # dati/processed/: nessuna richiesta alle fonti durante il deploy, così la
      # pubblicazione non dipende dal fatto che ISTAT risponda.
      - name: Costruisci i dati per il sito
        run: python -m brescia_pipeline.build --offline web

      - name: Verifica gli invarianti del contratto, con la soglia di copertura
        run: |
          pip install pytest pytest-cov pyyaml
          python -m pytest pipeline/tests -q --cov --cov-report=term-missing

      # Le cifre citate nei documenti devono tornare: se una diverge, non si
      # pubblica. È la stessa regola del repository, applicata in CI.
      - name: Ricalcola le cifre citate
        run: python analysis/verifica_cifre.py

      # La data del sito viene dal commit, non da un valore scritto a mano:
      # senza questo meccanismo le date invecchiano in silenzio e il sito mente.
      - name: Costruisci il sito
        run: |
          DATA_COMMIT=$(git log -1 --format=%cs)
          python sito/costruisci.py --uscita _site --data-build "$DATA_COMMIT"

      - name: Cosa succede dopo questa costruzione
        env:
          EVENTO: ${{ github.event_name }}
          CONFERMA: ${{ inputs.conferma }}
        run: |
          if [ "$EVENTO" = "push" ]; then
            echo "Push su main: se questa costruzione è verde, il sito va online."
          elif [ "$CONFERMA" = "pubblica" ]; then
            echo "Conferma ricevuta: il job «pubblica» girerà e il sito finirà online."
          else
            echo "Niente va online: questa esecuzione costruisce e verifica soltanto."
            echo "Il sito sta fra gli artefatti di questa pagina: scaricalo e aprilo."
            echo "Per pubblicare: fai merge su main, oppure rilancia a mano con"
            echo "  conferma = pubblica"
          fi

      - name: Controlla che i segnaposto siano tutti sostituiti
        run: |
          if grep -rlE '\{\{(c:[a-z0-9_]+|BUILD_DATE|DATA_DATE|N_[A-Z]+|BLOCCHI_TABELLE)\}\}' _site; then
            echo "segnaposto non sostituiti: vedi i file elencati sopra"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # Ogni push su `main` arriva qui, purché `costruisci` sia verde. Il lancio a
  # mano no, se non lo si chiede scrivendolo: serve a provare una build senza
  # mandarla online.
  pubblica:
    needs: costruisci
    if: github.event_name == 'push' || inputs.conferma == 'pubblica'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Sta qui e non nella costruzione: è l'unico passo che tocca le
      # impostazioni di Pages, e non deve girare su una build che non pubblica.
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - id: deploy
        uses: actions/deploy-pages@v5
