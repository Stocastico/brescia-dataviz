# Pubblica il sito su GitHub Pages.
#
# Parte a ogni push su `main`, e anche a mano (`workflow_dispatch`). Ma
# costruire non è pubblicare: il lavoro si divide in due job, e fra i due c'è un
# cancello.
#
#   costruisci  gira sempre: dati, test, cifre, sito, artefatto. Non tocca Pages
#               e non pubblica niente. L'artefatto è scaricabile dalla pagina
#               dell'esecuzione, quindi il sito si rilegge prima che esista un
#               indirizzo pubblico.
#   pubblica    gira solo se la variabile di repository PUBBLICA vale «si».
#
# 🙋 Il cancello lo apri tu, una volta sola, quando i testi ti convincono:
#    Settings → Secrets and variables → Actions → Variables → New variable,
#    nome PUBBLICA, valore si. Da quel momento ogni push su `main` pubblica
#    davvero. Per richiuderlo basta rimettere un altro valore.
#
#    In alternativa (o in aggiunta), l'ambiente `github-pages` accetta dei
#    «required reviewers»: con quelli ogni deploy si ferma ad aspettare un tuo
#    clic invece di dipendere da una variabile. Il cancello qui sotto è un
#    interruttore solo, e sta nel repository: si vede leggendo il workflow.
#
# 🙋 Da fare una volta sola, e lo può fare solo il proprietario del repository:
#    Settings → Pages → Source = «GitHub Actions».
#    Senza, il primo deploy fallisce. E non basta che Pages sia acceso: ad
#    agosto 2026 lo è, ma con la sorgente su un ramo, e con quella impostazione
#    GitHub passa il repository per Jekyll e pubblica il README invece del sito.
#    `configure-pages` con `enablement: true` accende Pages quando è spento, non
#    cambia la sorgente di un Pages già acceso.

name: Pubblica il sito

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Due deploy che si accavallano lasciano il sito a metà.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  costruisci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Serve la storia: la data dei dati viene dall'ultimo commit che ha
          # toccato dati/processed/, e con un checkout superficiale non c'è.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installa la pipeline
        run: pip install -e ./pipeline

      # I JSON per il sito si ricavano dalle tabelle versionate in
      # dati/processed/: nessuna richiesta alle fonti durante il deploy, così la
      # pubblicazione non dipende dal fatto che ISTAT risponda.
      - name: Costruisci i dati per il sito
        run: python -m brescia_pipeline.build --offline web

      - name: Verifica gli invarianti del contratto
        run: |
          pip install pytest
          python -m pytest pipeline/tests -q

      # Le cifre citate nei documenti devono tornare: se una diverge, non si
      # pubblica. È la stessa regola del repository, applicata in CI.
      - name: Ricalcola le cifre citate
        run: python analysis/verifica_cifre.py

      # La data del sito viene dal commit, non da un valore scritto a mano:
      # senza questo meccanismo le date invecchiano in silenzio e il sito mente.
      - name: Costruisci il sito
        run: |
          DATA_COMMIT=$(git log -1 --format=%cs)
          python sito/costruisci.py --uscita _site --data-build "$DATA_COMMIT"

      - name: Dove sta il cancello
        env:
          PUBBLICA: ${{ vars.PUBBLICA }}
        run: |
          if [ "$PUBBLICA" = "si" ]; then
            echo "PUBBLICA=si: il job «pubblica» girerà e il sito finirà online."
          else
            echo "PUBBLICA non è «si»: si costruisce e basta, niente va online."
            echo "Il sito costruito sta fra gli artefatti di questa esecuzione:"
            echo "scaricalo e aprilo per rileggerlo."
            echo "Per pubblicare: Settings → Secrets and variables → Actions →"
            echo "Variables → PUBBLICA = si."
          fi

      - name: Controlla che i segnaposto siano tutti sostituiti
        run: |
          if grep -rlE '\{\{(c:[a-z0-9_]+|BUILD_DATE|DATA_DATE|N_[A-Z]+)\}\}' _site; then
            echo "segnaposto non sostituiti: vedi i file elencati sopra"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # Il cancello. Con PUBBLICA diversa da «si» questo job si salta: la
  # costruzione resta verde, l'artefatto resta scaricabile, e online non
  # compare niente.
  pubblica:
    needs: costruisci
    if: vars.PUBBLICA == 'si'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Sta qui e non nella costruzione: è l'unico passo che tocca le
      # impostazioni di Pages, e con il cancello chiuso non deve girare.
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - id: deploy
        uses: actions/deploy-pages@v5
