# Costruisce il sito a ogni push, e lo pubblica **solo quando lo dici tu**.
#
# I due verbi sono separati apposta, perché sono due decisioni diverse:
#
#   costruisci  gira a ogni push su `main` e a ogni lancio manuale: dati, test,
#               ricalcolo delle cifre citate, sito, artefatto. Non tocca Pages e
#               non manda niente online. L'artefatto è scaricabile dalla pagina
#               dell'esecuzione, quindi il sito si rilegge prima che esista un
#               indirizzo pubblico — ed è il modo di controllarlo mentre
#               l'analisi va avanti.
#   pubblica    non parte da nessun evento automatico. Ci si arriva **solo** da
#               Actions → «Pubblica il sito» → Run workflow, scrivendo
#               `pubblica` nella casella di conferma.
#
# 🙋 Come si pubblica, quando l'analisi sarà finita:
#    Actions → «Pubblica il sito» → Run workflow → conferma = pubblica → Run.
#    Non c'è nessuna variabile da impostare prima e nessuno stato da ricordarsi
#    di richiudere dopo: la decisione si prende nel momento in cui si pubblica,
#    e vale per quella esecuzione sola.
#
#    Se un giorno vorrai che ogni push pubblichi davvero, la modifica è una
#    riga: togliere `github.event_name == 'workflow_dispatch' &&` dalla
#    condizione del job `pubblica`. Il test
#    `pipeline/tests/test_workflow_deploy.py` fallirà, ed è il suo mestiere:
#    serve a rendere quella riga una scelta e non una svista.
#
# 🙋 Da fare una volta sola, e lo può fare solo il proprietario del repository:
#    Settings → Pages → Source = «GitHub Actions».
#    Senza, il primo deploy fallisce. E non basta che Pages sia acceso: ad
#    agosto 2026 lo è, ma con la sorgente su un ramo, e con quella impostazione
#    GitHub passa il repository per Jekyll e pubblica il README invece del sito.
#    `configure-pages` con `enablement: true` accende Pages quando è spento, non
#    cambia la sorgente di un Pages già acceso.

name: Pubblica il sito

on:
  workflow_dispatch:
    inputs:
      conferma:
        description: 'Scrivi «pubblica» per mandare il sito online. Qualunque altra cosa costruisce e basta.'
        required: true
        default: 'no'
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Due build che si accavallano si annullano a vicenda senza danno; una
# pubblicazione annullata a metà lascerebbe il sito monco. I due generi di
# esecuzione stanno quindi in gruppi separati, così un push che arriva mentre
# stai pubblicando non tocca la pubblicazione.
concurrency:
  group: pages-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  costruisci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Serve la storia: la data dei dati viene dall'ultimo commit che ha
          # toccato dati/processed/, e con un checkout superficiale non c'è.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installa la pipeline
        run: pip install -e ./pipeline

      # I JSON per il sito si ricavano dalle tabelle versionate in
      # dati/processed/: nessuna richiesta alle fonti durante il deploy, così la
      # pubblicazione non dipende dal fatto che ISTAT risponda.
      - name: Costruisci i dati per il sito
        run: python -m brescia_pipeline.build --offline web

      - name: Verifica gli invarianti del contratto, con la soglia di copertura
        run: |
          pip install pytest pytest-cov pyyaml
          python -m pytest pipeline/tests -q --cov --cov-report=term-missing

      # Le cifre citate nei documenti devono tornare: se una diverge, non si
      # pubblica. È la stessa regola del repository, applicata in CI.
      - name: Ricalcola le cifre citate
        run: python analysis/verifica_cifre.py

      # La data del sito viene dal commit, non da un valore scritto a mano:
      # senza questo meccanismo le date invecchiano in silenzio e il sito mente.
      - name: Costruisci il sito
        run: |
          DATA_COMMIT=$(git log -1 --format=%cs)
          python sito/costruisci.py --uscita _site --data-build "$DATA_COMMIT"

      - name: Cosa succede dopo questa costruzione
        env:
          EVENTO: ${{ github.event_name }}
          CONFERMA: ${{ inputs.conferma }}
        run: |
          if [ "$EVENTO" = "workflow_dispatch" ] && [ "$CONFERMA" = "pubblica" ]; then
            echo "Conferma ricevuta: il job «pubblica» girerà e il sito finirà online."
          else
            echo "Niente va online: questa esecuzione costruisce e verifica soltanto."
            echo "Il sito sta fra gli artefatti di questa pagina: scaricalo e aprilo."
            echo "Per pubblicare davvero, quando l'analisi sarà finita:"
            echo "  Actions -> «Pubblica il sito» -> Run workflow -> conferma = pubblica"
          fi

      - name: Controlla che i segnaposto siano tutti sostituiti
        run: |
          if grep -rlE '\{\{(c:[a-z0-9_]+|BUILD_DATE|DATA_DATE|N_[A-Z]+)\}\}' _site; then
            echo "segnaposto non sostituiti: vedi i file elencati sopra"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # Il cancello, e non è una variabile: è l'evento stesso. Nessun push, nessuno
  # schedule e nessun `repository_dispatch` può soddisfare questa condizione —
  # ci si arriva solo da «Run workflow» scrivendo la conferma.
  pubblica:
    needs: costruisci
    if: github.event_name == 'workflow_dispatch' && inputs.conferma == 'pubblica'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Sta qui e non nella costruzione: è l'unico passo che tocca le
      # impostazioni di Pages, e senza conferma non deve girare.
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - id: deploy
        uses: actions/deploy-pages@v5
