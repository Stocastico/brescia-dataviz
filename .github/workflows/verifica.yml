# I controlli che girano a ogni push. Nessuna richiesta alle fonti: i test che
# avrebbero bisogno della rete non esistono — i dataset che scaricano si
# esercitano con risposte finte — e quelli che hanno bisogno delle tabelle si
# saltano da soli se non ci sono.
#
# La suite copre i tre pezzi di codice del progetto: la pipeline, i quindici
# script di `analysis/` e il costruttore del sito. Prima gli ultimi due
# giravano qui come due liste di comandi; adesso sono test, quindi falliscono
# anche in locale e con un nome che dice cosa si è rotto. La soglia di
# copertura sta in `.coveragerc`, che è anche il posto dove alzarla.

name: Verifica

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Serve la storia: la data dei dati viene dall'ultimo commit che ha
          # toccato dati/processed/, e con un checkout superficiale non c'è.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # pyyaml non serve alla pipeline: serve al test che controlla che il
      # workflow di pubblicazione non possa partire da solo.
      - run: pip install -e ./pipeline pytest pytest-cov pyyaml

      # I JSON per il sito si rifanno **prima** dei test, dalle tabelle
      # versionate: così la suite gira su un export fresco invece che su quello
      # committato, e una divergenza fra i due si vede qui e non dopo il deploy.
      - name: Ricostruisci l'export per il sito
        run: python -m brescia_pipeline.build --offline web

      - name: Test, con la soglia di copertura
        run: python -m pytest pipeline/tests -q --cov --cov-report=term-missing

      # Resta un passo a sé anche se è dentro la suite: è il controllo che i
      # documenti citano per nome, e un passo rosso che si chiama così dice da
      # solo cosa è successo.
      - name: Le cifre citate nei documenti tornano
        run: python analysis/verifica_cifre.py
